name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -r requirements-ci.txt
      - name: Privacy and media scan
        run: python scripts/privacy_scan.py
      - name: Registry and smoke tests (no data, CPU)
        run: python -m pytest -q tests
      - name: Module unit tests (data-dependent tests skip)
        working-directory: FLAG_2027
        run: >
          python -m pytest -q local_validation/test_cross_modal.py local_validation/test_fold_pipeline.py
          local_validation/test_full_submission.py local_validation/test_metrics.py
          gamp_vf/test_gamp_vf.py gamp_vf/test_pseudo_pipeline.py phase2/test_phase2.py phase3/test_phase3.py
  site:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: site } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
      - name: Type-check and build (base path of the project site)
        run: npm run build
        env: { BASE_PATH: "/${{ github.event.repository.name }}/" }
      - name: Server-side render check (every experiment panel; numbers vs registry)
        run: npm run check
